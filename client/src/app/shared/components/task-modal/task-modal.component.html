<div class="modal-overlay" *ngIf="isOpen" (click)="close()">
  <div class="modal-content solid-panel" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <h2>{{ task ? editTitle : createTitle }}</h2>
      <button class="close-btn" (click)="close()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </header>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
      <div class="form-group">
        <label for="title">{{ titleLabel }}</label>
        <input
          type="text"
          id="title"
          formControlName="title"
          [placeholder]="titlePlaceholder"
          [class.error]="isFieldInvalid('title')"
        />
        <span class="error-msg" *ngIf="isFieldInvalid('title')">{{ titleErrorMsg }}</span>
      </div>

      <div class="form-group">
        <label for="description">{{ descLabel }}</label>
        <textarea
          id="description"
          formControlName="description"
          [placeholder]="descPlaceholder"
          rows="3"
          [class.error]="isFieldInvalid('description')"
        ></textarea>
        <span class="error-msg" *ngIf="isFieldInvalid('description')">{{ descErrorMsg }}</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" formControlName="status">
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="review">Review</option>
            <option value="done">Done</option>
          </select>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" formControlName="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="project">Project</label>
        <input
          type="text"
          id="project"
          formControlName="project"
          placeholder="Project name"
          [class.error]="isFieldInvalid('project')"
        />
        <span class="error-msg" *ngIf="isFieldInvalid('project')">Project name is required</span>
      </div>

      <footer class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close()">{{ cancelBtnText }}</button>
        <button type="submit" class="btn-primary" [disabled]="taskForm.invalid">
          {{ task ? saveBtnText : createBtnText }}
        </button>
      </footer>
    </form>
  </div>
</div>
