<div class="dashboard-content">
  <header class="page-header">
    <div class="header-main">
      <h1>Overview</h1>
      <p class="text-muted">Welcome back! Here's what's happening with your projects today.</p>
    </div>
    <div class="header-stats">
      <div class="stat-card glass-panel">
        <span class="stat-label">Completed</span>
        <span class="stat-value">24</span>
        <span class="stat-trend positive">↑ 12%</span>
      </div>
      <div class="stat-card glass-panel">
        <span class="stat-label">In Progress</span>
        <span class="stat-value">08</span>
        <span class="stat-trend neutral">→ 0%</span>
      </div>
    </div>
  </header>

  <div class="dashboard-grid">
    <section class="tasks-section glass-card">
      <div class="section-header">
        <h3>Recent Tasks</h3>
        <button class="btn-ghost">View All</button>
      </div>
      <div class="task-list">
        <div class="task-item">
          <div class="task-status status-done"></div>
          <div class="task-info">
            <span class="task-title">Implement OAuth Flow</span>
            <span class="task-meta">Backend • High Priority</span>
          </div>
          <span class="task-time">2h ago</span>
        </div>
        <div class="task-item">
          <div class="task-status status-todo"></div>
          <div class="task-info">
            <span class="task-title">Design System Revamp</span>
            <span class="task-meta">Frontend • Medium Priority</span>
          </div>
          <span class="task-time">Yesterday</span>
        </div>
      </div>
    </section>

    <section class="activity-section glass-card">
      <div class="section-header">
        <h3>Project Stats</h3>
      </div>
      <div class="stats-display">
        <div class="chart-placeholder">
          <div class="bar" style="height: 60%"></div>
          <div class="bar" style="height: 80%"></div>
          <div class="bar" style="height: 45%"></div>
          <div class="bar" style="height: 90%"></div>
          <div class="bar" style="height: 70%"></div>
        </div>
      </div>
    </section>
  </div>
</div>
