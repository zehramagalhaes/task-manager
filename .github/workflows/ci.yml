name: CI

on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    # All commands run from the monorepo root so that npm workspaces
    # can hoist and resolve dependencies correctly.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Root package-lock.json covers all workspaces
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint — client & server
        run: npm run lint

      - name: Test — client (with coverage)
        run: npm run client:test-coverage

      - name: Test — server
        run: npm run server:test

      - name: Build — production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: client/dist/task-manager-client/browser
          retention-days: 1
